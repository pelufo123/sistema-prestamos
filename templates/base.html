<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema</title>

    <link rel="stylesheet" href="/static/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>💰 Sistema</h2>

    <a href="/panel">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>

    <a href="/clientes">
        <i class="fa-solid fa-users"></i>
        Clientes
    </a>

    <a href="/prestamos">
        <i class="fa-solid fa-hand-holding-dollar"></i>
        Préstamos
    </a>

    <a href="/abonos">
        <i class="fa-solid fa-money-bill-wave"></i>
        Abonos
    </a>

    <a href="/logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        Cerrar sesión
    </a>

</div>

<!-- TOPBAR -->
<div class="topbar">

    <div>
        SoftwarePelufo
    </div>

    <div class="user-box">

        <div class="online"></div>

        <div>
            <div class="user-name">
                {{ session["usuario"] }}
            </div>

            <div class="user-role">
                En línea
            </div>
        </div>

    </div>

</div>

<!-- MAIN -->
<div class="main">

    {% block content %}
    {% endblock %}

</div>


<script>

function formatearMiles(input){

    // 🔥 quitar todo lo que NO sea número
    let valor = input.value.replace(/\D/g, "");

    // 🔥 colocar puntos automáticamente
    valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    input.value = valor;
}

// 🔥 convertir a número real para enviar al backend
function limpiarNumero(valor){
    return valor.replace(/\./g, "");
}

// 🔥 TODOS los inputs con class="money"
document.addEventListener("DOMContentLoaded", function(){

    const inputs = document.querySelectorAll(".money");

    inputs.forEach(input => {

        input.addEventListener("input", function(){
            formatearMiles(this);
        });

        // 🔥 antes de enviar formulario
        input.form?.addEventListener("submit", function(){

            inputs.forEach(i => {
                i.value = limpiarNumero(i.value);
            });

        });

    });

});

</script>

</body>
</html>
