{% extends "base.html" %}

{% block content %}

<h2>🏠 Dashboard Principal</h2>

<!-- MÉTRICAS -->
<div class="grid">

    <div class="card blue">
        <div class="label">Capital en calle</div>

        <div class="metric">
            ${{ capital_total }}
        </div>
    </div>

    <div class="card green">
        <div class="label">Capital recogido hoy</div>

        <div class="metric">
            ${{ capital_dia }}
        </div>
    </div>

    <div class="card orange">
        <div class="label">Interés recogido hoy</div>

        <div class="metric">
            ${{ interes_dia }}
        </div>
    </div>

    <div class="card red">
        <div class="label">Interés acumulado</div>

        <div class="metric">
            ${{ interes_acumulado }}
        </div>
    </div>

</div>

{% endblock %}
