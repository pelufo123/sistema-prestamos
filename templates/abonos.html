```html
<!-- templates/abonos.html -->

{% extends "base.html" %}

{% block content %}

<h2 class="titulo-panel">
    💸 Abonos
</h2>

<!-- ===================================== -->
<!-- SELECCIONAR CLIENTE -->
<!-- ===================================== -->

<div class="card">

    <form method="GET">

        <label>Seleccionar cliente</label>

        <select
            name="cliente"
            onchange="this.form.submit()"
        >

            <option value="">
                Seleccione cliente
            </option>

            {% for c in clientes %}

            <option
                value="{{ c[0] }}"
                {% if cliente_id == c[0]|string %}selected{% endif %}
            >

                {{ c[1] }}

            </option>

            {% endfor %}

        </select>

    </form>

</div>

<!-- ===================================== -->
<!-- PRÉSTAMOS -->
<!-- ===================================== -->

{% if prestamos %}

    {% for p in prestamos %}

    <div class="card">

        <h3>
            👤 {{ p.nombre }}
        </h3>

        <div class="grid-metricas">

            <div>

                <div class="label">
                    Capital
                </div>

                <div class="metric">
                    ${{ p.capital }}
                </div>

            </div>

            <div>

                <div class="label">
                    Interés
                </div>

                <div class="metric">
                    ${{ p.interes }}
                </div>

            </div>

            <div>

                <div class="label">
                    Total
                </div>

                <div class="metric">
                    ${{ p.total }}
                </div>

            </div>

        </div>

        <br>

        <form method="POST">

            <input
                type="hidden"
                name="cliente"
                value="{{ cliente_id }}"
            >

            <input
                type="hidden"
                name="prestamo"
                value="{{ p.id }}"
            >

            <input
                type="hidden"
                class="prestamo_id"
                value="{{ p.id }}"
            >

            <label>Tipo de abono</label>

            <select
                name="tipo"
                class="tipo"
                onchange="cambiarTipo(this)"
            >

                <option value="interes">
                    Interés
                </option>

                <option value="capital">
                    Capital
                </option>

            </select>

            <br><br>

            <div class="div_mes">

                <label>Mes a pagar</label>

                <select
                    name="mes"
                    class="mes"
                    onchange="cargarInteres(this)"
                >

                    {% if p.meses %}

                        {% for m in p.meses %}

                        <option value="{{m}}">
                            Mes {{m}}
                        </option>

                        {% endfor %}

                    {% else %}

                        <option value="">
                            Sin meses disponibles
                        </option>

                    {% endif %}

                </select>

            </div>

            <br>

            <label>Monto</label>

            <input
                type="text"
                name="monto"
                class="monto money"
                placeholder="50.000"
                required
            >

            <br><br>

            <button>
                💾 Guardar abono
            </button>

        </form>

    </div>

    {% endfor %}

{% endif %}

<!-- ===================================== -->
<!-- MENSAJES -->
<!-- ===================================== -->

{% if mensaje %}

<div class="card red">

    {{ mensaje }}

</div>

{% endif %}

<!-- ===================================== -->
<!-- SCRIPTS -->
<!-- ===================================== -->

<script>

function cambiarTipo(select){

    let form = select.closest("form");

    let tipo = select.value;

    let divMes = form.querySelector(".div_mes");

    let monto = form.querySelector(".monto");

    if(tipo === "capital"){

        divMes.style.display = "none";

        monto.value = "";

    }else{

        divMes.style.display = "block";

        let selectMes = form.querySelector(".mes");

        cargarInteres(selectMes);

    }
}

function cargarInteres(select){

    let form = select.closest("form");

    let prestamo_id =
    form.querySelector(".prestamo_id").value;

    let monto =
    form.querySelector(".monto");

    fetch(`/obtener_interes?prestamo_id=${prestamo_id}`)

    .then(response => response.json())

    .then(data => {

        monto.value =
        Number(data.interes)
        .toLocaleString("es-CO");

    })

    .catch(error => {

        console.log("Error:", error);

    });

}

/* ===================================== */
/* FORMATO DINERO */
/* ===================================== */

function formatearMiles(input){

    let valor = input.value.replace(/\D/g, "");

    valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    input.value = valor;
}

function limpiarNumero(valor){

    return valor.replace(/\./g, "");
}

document.addEventListener("DOMContentLoaded", function(){

    const inputs =
    document.querySelectorAll(".money");

    inputs.forEach(input => {

        input.addEventListener("input", function(){

            formatearMiles(this);

        });

        input.form.addEventListener("submit", function(){

            inputs.forEach(i => {

                i.value = limpiarNumero(i.value);

            });

        });

    });

    document.querySelectorAll(".tipo").forEach(select => {

        cambiarTipo(select);

    });

});

</script>

{% endblock %}
```
